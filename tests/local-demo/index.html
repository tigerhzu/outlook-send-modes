<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司範本 · 本地模擬</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#17233b;background:#edf2f7;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{padding:20px 28px;background:#103f88;color:white}h1{font-size:23px;margin:0 0 6px}header p{margin:0;color:#e2eafa;line-height:1.5}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 28px;background:white;border-bottom:1px solid #d8e1ef}select,button{font:inherit;border:1px solid #b6c4d8;border-radius:7px;background:white;padding:7px 11px}button{cursor:pointer}.layout{display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);gap:20px;padding:20px;max-width:1450px;margin:auto}.panel{background:white;border:1px solid #d8e1ef;border-radius:12px;overflow:hidden}h2{font-size:17px;margin:0;padding:14px 20px;border-bottom:1px solid #d8e1ef}#taskpane{display:block;width:100%;height:calc(100vh - 245px);min-height:620px;border:0}.fields{padding:16px 20px;display:grid;grid-template-columns:60px 1fr;gap:8px;border-bottom:1px solid #d8e1ef}.fields dt{color:#63738d}.fields dd{margin:0;overflow-wrap:anywhere}.body{padding:20px;min-height:260px;line-height:1.7}.body table{max-width:100%}.body blockquote{border-left:3px solid #cad5e4;padding-left:16px;color:#62728a}#result{display:block;padding:12px 20px;background:#f5f8fc;color:#49617c;border-top:1px solid #d8e1ef}#draft-body{width:100%;min-height:400px;border:0}small{color:#63738d}@media(max-width:800px){header,.toolbar{padding:14px}.layout{grid-template-columns:1fr;padding:12px}#taskpane{height:760px;min-height:0}}
</style></head><body>
<header><h1>公司範本 · 本地模擬</h1><p>實際公司版介面與範本 API，搭配虛構帳號及模擬草稿。未連接真實 Outlook／公司租戶。</p></header>
<div class="toolbar"><label>測試角色 <select id="role"><option value="reader">一般同仁</option><option value="editor">編輯者</option><option value="publisher">發布者</option></select></label><button id="reset" type="button">重設模擬草稿</button><small>先按左側「公司帳號登入」，再選範本。角色切換後請重新登入。</small></div>
<main class="layout"><section class="panel"><h2>增益集</h2><iframe id="taskpane" title="公司範本工作窗格" src="/taskpane.html?demoRole=reader"></iframe></section><section class="panel"><h2>模擬草稿</h2><dl class="fields"><dt>To</dt><dd id="to"></dd><dt>CC</dt><dd id="cc"></dd><dt>主旨</dt><dd id="subject"></dd></dl><iframe id="draft-body" title="模擬草稿內容" sandbox="" referrerpolicy="no-referrer"></iframe><output id="result">尚未插入範本</output></section></main><script src="/__demo/shell.js"></script></body></html>
