<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:640px;border-collapse:collapse;font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:14px;color:#1d2733;">
  <tr><td style="padding:0 0 12px 0;line-height:1.7;">Hi Purple,</td></tr>
  <tr><td style="padding:0 0 16px 0;line-height:1.7;">我預計於以下時間加班，若無問題，煩請核可，</td></tr>
  <tr><td style="padding:0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;border:1px solid #d6dde6;">
      <tr><td colspan="2" style="background:#1f4e79;color:#ffffff;font-weight:bold;font-size:15px;padding:10px 14px;">加班申請</td></tr>
      <tr><td width="170" style="width:170px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">預計加班日期</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{date}}</td></tr>
      <tr><td width="170" style="width:170px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">起訖時間</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{time}}</td></tr>
      <tr><td width="170" style="width:170px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">加班時數</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{hours}}</td></tr>
      <tr><td width="170" style="width:170px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">案件編號／客戶</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{case}}</td></tr>
      <tr><td width="170" style="width:170px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">工作內容</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{work}}</td></tr>
      <tr><td width="170" style="width:170px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">備註</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{note}}</td></tr>
    </table>
  </td></tr>
</table>
