<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:640px;border-collapse:collapse;font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:14px;color:#1d2733;">
  <tr><td style="padding:0 0 12px 0;line-height:1.7;">Hi Hank,</td></tr>
  <tr><td style="padding:0 0 16px 0;line-height:1.7;">申請{{date}}居家上班，以下為當日預計工作內容：</td></tr>
  <tr><td style="padding:0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;border:1px solid #d6dde6;">
      <tr>
        <td width="40" style="width:40px;background:#1f4e79;color:#ffffff;font-weight:bold;padding:10px 8px;text-align:center;">#</td>
        <td width="120" style="width:120px;background:#1f4e79;color:#ffffff;font-weight:bold;padding:10px 12px;">案件編號</td>
        <td width="150" style="width:150px;background:#1f4e79;color:#ffffff;font-weight:bold;padding:10px 12px;">客戶</td>
        <td style="background:#1f4e79;color:#ffffff;font-weight:bold;padding:10px 12px;">工作內容</td>
      </tr>
<!--ROW START-->
      <tr>
        <td style="background:{{row_bg}};padding:10px 8px;border-top:1px solid #d6dde6;text-align:center;color:#5d6b7a;">{{row_n}}</td>
        <td style="background:{{row_bg}};padding:10px 12px;border-top:1px solid #d6dde6;">{{case}}</td>
        <td style="background:{{row_bg}};padding:10px 12px;border-top:1px solid #d6dde6;">{{client}}</td>
        <td style="background:{{row_bg}};padding:10px 12px;border-top:1px solid #d6dde6;line-height:1.6;">{{work}}</td>
      </tr>
<!--ROW END-->
    </table>
  </td></tr>
  <tr><td style="padding:16px 0 0 0;line-height:1.7;">下班前會再回報完成狀況，以上，謝謝。</td></tr>
</table>
