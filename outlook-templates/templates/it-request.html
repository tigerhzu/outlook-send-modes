<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:640px;border-collapse:collapse;font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:14px;color:#1d2733;">
  <tr><td style="padding:0 0 12px 0;line-height:1.7;">Hi Jane,</td></tr>
  <tr><td style="padding:0 0 16px 0;line-height:1.7;">想申請{{request}}，{{usage}}，需求如下：</td></tr>
  <tr><td style="padding:0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;border:1px solid #d6dde6;">
      <tr><td colspan="2" style="background:#1f4e79;color:#ffffff;font-weight:bold;font-size:15px;padding:10px 14px;">內部 IT 需求單</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">需求類型</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{type}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">系統或軟體名稱</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{system}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">需求動作</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{action}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">需求內容</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{content}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">需求原因／用途</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{purpose}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">使用／影響對象</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{scope}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">希望完成日期</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{due}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">其他補充／說明</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{note}}</td></tr>
      <tr><td width="190" style="width:190px;background:#f2f5f9;color:#1f4e79;font-weight:bold;padding:10px 14px;border-top:1px solid #d6dde6;vertical-align:top;">主管審核</td><td style="padding:10px 14px;border-top:1px solid #d6dde6;line-height:1.6;">{{approval}}</td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:16px 0 0 0;line-height:1.7;">再請協助評估與開通，如需補充資料請告知，謝謝。</td></tr>
</table>
